name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Version (e.g. 2.2.0)'
        required: true
        type: string
      tag_name:
        description: 'Release Tag Name (e.g. 2.2.0)'
        required: true
        type: string
      release_name:
        description: 'Release Name (e.g. Release v2.2.0)'
        required: true
        type: string
      is_pre_release:
        description: 'Publish as a Pre-release?'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # >=20 required: the production build minifies via @rollup/plugin-terser,
          # whose serialize-javascript dependency calls the global crypto object at
          # module load. That global does not exist on Node 18 (added in 19).
          node-version: 20
          cache: 'npm'

      # Obsidian requires a bare semver in manifest.json. A "v" prefix silently shipped once
      # (v2.9.9), which the registry rejects and Obsidian cannot compare for updates.
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not valid semver. Use 3.0.0, not v3.0.0."
            exit 1
          fi

      # npm ci must run before `npm version`, which rewrites package-lock.json.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bump versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          jq --arg v "$VERSION" '.version = $v' manifest.json > tmp.json && mv tmp.json manifest.json

          # versions.json maps each plugin version to the Obsidian version it needs; the
          # community registry reads it from the default branch.
          MIN_APP=$(jq -r '.minAppVersion' manifest.json)
          if [ ! -f versions.json ]; then echo '{}' > versions.json; fi
          jq --arg v "$VERSION" --arg m "$MIN_APP" '. + {($v): $m}' versions.json > tmp.json && mv tmp.json versions.json

      - name: Build plugin
        run: npm run build

      - name: Commit and Push Version Bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git commit -m "chore: bump version to $VERSION"
          git push

      - name: Create GitHub Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as environment variables rather than interpolated into the script body:
          # ${{ }} inside `run:` is substituted before the shell sees it, so a crafted input
          # would execute as shell.
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_NAME: ${{ inputs.release_name }}
          IS_PRE_RELEASE: ${{ inputs.is_pre_release }}
        run: |
          # Build arguments safely to avoid passing empty strings
          ARGS=("$TAG_NAME" "--title" "$RELEASE_NAME" "--notes" "Release $TAG_NAME generated by GitHub Actions")
          if [ "$IS_PRE_RELEASE" == "true" ]; then
            ARGS+=("--prerelease")
          fi
          
          # Locate generated main.js (handles rollup outputting to subdirectories)
          if [ -f "main.js" ]; then
            MAIN_JS="main.js"
          elif [ -f "dist/main.js" ]; then
            MAIN_JS="dist/main.js"
          elif [ -f "build/main.js" ]; then
            MAIN_JS="build/main.js"
          else
            echo "Error: main.js not found! Verify your rollup.config.mjs output configuration."
            exit 1
          fi
          
          ASSETS=("${MAIN_JS}#main.js" "manifest.json#manifest.json")
          
          if [ -f "styles.css" ]; then ASSETS+=("styles.css#styles.css"); fi
          if [ -f "dist/styles.css" ]; then ASSETS+=("dist/styles.css#styles.css"); fi
          
          gh release create "${ARGS[@]}" "${ASSETS[@]}"